# Startet den Bot und Caddy (holt automatisch ein HTTPS-Zertifikat).
# Vorher: .env ausfüllen und in Caddyfile deine Domain eintragen.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - app_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
